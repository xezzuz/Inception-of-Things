apiVersion: v1              # Core Kubernetes API version used by Services

kind: Service               # The type of Kubernetes object we are creating
metadata:                   # Identity information about this Service
  name: app-three        # Stable Service name and internal DNS name

spec:                       # Desired network routing configuration
  selector:                 # Finds the Pods that should receive traffic
    app: app3               # Must match the app3 Pod label from the Deployment
  ports:                    # List of ports exposed by the Service
    - port: 80              # Service port: clients, including Ingress, connect here
      targetPort: 5678      # Container port: traffic is forwarded here on each Pod
